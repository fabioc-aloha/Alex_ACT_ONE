name: Verify source candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  structural:
    name: Structural / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        node: ${{ fromJSON(github.event_name == 'push' && '["24"]' || '["24","26"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify structural contracts without provisioning packages
        shell: pwsh
        run: node (Join-Path $PWD 'scripts' 'verification-gate.mjs') --lane structural
      - name: Require unchanged tracked sources
        shell: pwsh
        run: git diff --exit-code

  integration:
    name: Provisioned runtime / ${{ matrix.os }} / Node 26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      NPM_CONFIG_PROGRESS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: ci/runtime/package-lock.json
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          pandoc-version: '3.13'
      - name: Select a disposable runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'alex-act-one-runtime'
          "ALEX_ACT_ONE_RUNTIME_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Provision reviewed packages on this disposable runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ALEX_ACT_ONE_RUNTIME_ROOT | Out-Null
          Copy-Item (Join-Path $PWD 'ci' 'runtime' 'package.json') $env:ALEX_ACT_ONE_RUNTIME_ROOT
          Copy-Item (Join-Path $PWD 'ci' 'runtime' 'package-lock.json') $env:ALEX_ACT_ONE_RUNTIME_ROOT
          npm ci --prefix $env:ALEX_ACT_ONE_RUNTIME_ROOT --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify runtime and real converter output without skips
        shell: pwsh
        run: node (Join-Path $PWD 'scripts' 'verification-gate.mjs') --lane integration
      - name: Check canonical Windows demo rebuilds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node (Join-Path $PWD 'scripts' 'build-flint-showcase.mjs') --describe-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $PWD 'scripts' 'build-flint-showcase.mjs') --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $PWD 'scripts' 'build-flint-showcase.mjs') --experimental --check
      - name: Require unchanged tracked sources
        shell: pwsh
        run: git diff --exit-code
